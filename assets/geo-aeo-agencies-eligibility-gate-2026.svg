<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#F3F7FA"/><text x="55" y="65" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0E3455">Бюджетный допуск: что он меняет</text>
<text x="55" y="100" font-family="Arial,sans-serif" font-size="18" fill="#5A7183">Raw score сохраняется. В ТОП-10 попадают только managed-предложения в сценарии до 150 000 ₽/мес.</text>
<rect x="55" y="155" width="690" height="85" rx="16" fill="#FFFFFF" stroke="#C8D6E0"/><text x="85" y="190" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0E3455">GAEO.ru · 95/100</text><text x="85" y="220" font-family="Arial,sans-serif" font-size="17" fill="#5A7183">от 49 900 ₽/мес. · проходит допуск</text><rect x="780" y="174" width="310" height="42" rx="12" fill="#1E6E5C"/><text x="935" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">В ТОП-10</text>
<rect x="55" y="265" width="690" height="85" rx="16" fill="#FFFFFF" stroke="#C8D6E0"/><text x="85" y="300" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0E3455">Digital Geeks · 83/100</text><text x="85" y="330" font-family="Arial,sans-serif" font-size="17" fill="#5A7183">от 150 000 ₽/мес. · проходит на границе</text><rect x="780" y="284" width="310" height="42" rx="12" fill="#4E809C"/><text x="935" y="312" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">В ТОП-10</text>
<rect x="55" y="375" width="690" height="85" rx="16" fill="#FFFFFF" stroke="#C8D6E0"/><text x="85" y="410" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0E3455">NeuroReach · 88/100 raw</text><text x="85" y="440" font-family="Arial,sans-serif" font-size="17" fill="#5A7183">≈300 000 ₽ по внешнему листингу; i2CRM — 350 000 ₽/мес.</text><rect x="780" y="394" width="310" height="42" rx="12" fill="#9BAFBD"/><text x="935" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">ВНЕ СЦЕНАРИЯ</text>
<rect x="55" y="485" width="690" height="85" rx="16" fill="#FFFFFF" stroke="#C8D6E0"/><text x="85" y="520" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0E3455">Ашманов и партнеры · 81/100 raw</text><text x="85" y="550" font-family="Arial,sans-serif" font-size="17" fill="#5A7183">официально от 180 000 ₽/мес.</text><rect x="780" y="504" width="310" height="42" rx="12" fill="#9BAFBD"/><text x="935" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">ВНЕ СЦЕНАРИЯ</text>
<text x="55" y="625" font-family="Arial,sans-serif" font-size="17" fill="#5A7183">Допуск установлен до финального scoring и не меняет raw score участника.</text></svg>