<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 335"><rect width="1150" height="335" fill="#f6f8fa"/><text x="36" y="49" font-size="26" fill="#0e3455" font-weight="bold" font-family="Arial">Что входит в конкретный GEO-пакет</text><rect x="24" y="100" width="264" height="130" rx="10" fill="#ffffff" stroke="#b8cad8"/><text x="38" y="149" font-size="19" font-weight="bold" fill="#0e3455" font-family="Arial">Сайт</text><text x="38" y="183" font-size="15" fill="#45677d" font-family="Arial">Изменения или ТЗ</text><rect x="308" y="100" width="264" height="130" rx="10" fill="#ffffff" stroke="#b8cad8"/><text x="322" y="149" font-size="19" font-weight="bold" fill="#0e3455" font-family="Arial">Контент</text><text x="322" y="183" font-size="15" fill="#45677d" font-family="Arial">Кто создает тексты</text><rect x="592" y="100" width="264" height="130" rx="10" fill="#ffffff" stroke="#b8cad8"/><text x="606" y="149" font-size="19" font-weight="bold" fill="#0e3455" font-family="Arial">Внешние площадки</text><text x="606" y="183" font-size="15" fill="#45677d" font-family="Arial">Кто размещает и платит</text><rect x="876" y="100" width="264" height="130" rx="10" fill="#ffffff" stroke="#b8cad8"/><text x="890" y="149" font-size="19" font-weight="bold" fill="#0e3455" font-family="Arial">Мониторинг</text><text x="890" y="183" font-size="15" fill="#45677d" font-family="Arial">Какие метрики и сроки</text><text x="35" y="285" font-size="17" fill="#527188" font-family="Arial">Название услуги не доказывает наличие каждой работы в минимальном тарифе</text></svg>