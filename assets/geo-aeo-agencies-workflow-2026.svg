<rect x="910" y="165" width="235" height="115" rx="18" fill="#FFFFFF" stroke="#C8D6E0"/><text x="937" y="205" font-size="21" font-weight="700" fill="#0E3455">4. Дистрибуция</text><text x="937" y="240" font-size="17" fill="#5A7183">внешние публикации</text><text x="937" y="264" font-size="17" fill="#5A7183">репутация · PR</text>
<path d="M1025 295 V350" stroke="#1E6E5C" stroke-width="5"/><polygon points="1025,350 1016,336 1034,336" fill="#1E6E5C"/>
