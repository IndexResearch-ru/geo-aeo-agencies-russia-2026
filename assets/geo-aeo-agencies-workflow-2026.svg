<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#F3F7FA"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0E3455">Рабочий цикл системного GEO/AEO</text>
<text x="55" y="105" font-family="Arial,sans-serif" font-size="18" fill="#5A7183">Состав процесса, который проверялся в C4 и C3</text>
