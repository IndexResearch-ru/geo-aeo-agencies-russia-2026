<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350"><rect width="1000" height="350" fill="#f6f8fa"/><text x="42" y="52" font-size="29" fill="#0e3455" font-family="Arial" font-weight="bold">59 наблюдений о ценах и условиях</text><text x="45" y="127" font-size="21" font-family="Arial" fill="#0e3455">Явно за месяц</text><rect x="275" y="105" rx="5" width="510" height="29" fill="#123f61"/><text x="800" y="128" font-size="21" fill="#0e3455" font-family="Arial">30</text><text x="45" y="201" font-size="21" font-family="Arial" fill="#0e3455">Период не указан</text><rect x="275" y="179" rx="5" width="340" height="29" fill="#65849e"/><text x="630" y="202" font-size="21" fill="#0e3455" font-family="Arial">20</text><text x="45" y="275" font-size="21" font-family="Arial" fill="#0e3455">Другие единицы</text><rect x="275" y="253" rx="5" width="153" height="29" fill="#a7bbc9"/><text x="443" y="276" font-size="21" fill="#0e3455" font-family="Arial">9</text><text x="45" y="338" font-size="15" fill="#527188" font-family="Arial">Это строки наблюдений, не 59 независимых тарифов</text></svg>